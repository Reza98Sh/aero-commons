[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aero-commons"
version = "0.1.0"
description = "Reusable Django app for custom user management with LDAP support and common utilities for Aero organization."
readme = "readme.md"
license = {text = "MIT"}
requires-python = ">=3.8"

authors = [
    {name = "Reza Sharafi", email = "Sharafi.Reza@aero.mapnagroup.com"},
]

dependencies = [
    "Django>=4.0",
    "ldap3>=2.9",
    "django-mptt>=0.14",
    "Pillow>=9.0",
]


